# Hosting for the Etsy Digital Listing Generator: the React app as static files,
# the API as Netlify Functions, data in Netlify's Postgres, listing files in
# Blobs. Pushing to GitHub rebuilds and republishes all of it.

[build]
  command = "npm ci --prefix server && npm ci --prefix client && npm run setup --prefix server && npm run build --prefix client"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  # pdfkit reads its font metrics from disk, @google/genai is a large CJS package,
  # and pg is loaded with a dynamic import — all three are traced as files instead
  # of folded into the bundle, so esbuild cannot inline them.
  external_node_modules = ["pdfkit", "@google/genai", "@anthropic-ai/sdk", "pg"]
  node_bundler = "esbuild"

# A synchronous invocation always stops at 60 seconds and there is no setting
# to raise it, which is why generation runs as a background function.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
