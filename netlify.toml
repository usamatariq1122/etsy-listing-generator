# Hosting for the Etsy Digital Listing Generator: the React app as static files,
# the API as Netlify Functions, data in Netlify's Postgres, listing files in
# Blobs. Pushing to GitHub rebuilds and republishes all of it.

[build]
  command = "npm ci --prefix server && npm ci --prefix client && npm run setup --prefix server && npm run build --prefix client"
  publish = "client/dist"
  # Inside server/ on purpose: the Function entries import from ../src, and Netlify
  # resolves and ships a function's node_modules from the package that holds it.
  functions = "server/netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  # pdfkit reads its font metrics from disk, @google/genai is a large CJS package,
  # pg is loaded with a dynamic import and nodemailer is only imported once a mail
  # transport is actually used — all four are traced as files instead of folded
  # into the bundle, so esbuild cannot inline them.
  external_node_modules = ["pdfkit", "@google/genai", "@anthropic-ai/sdk", "pg", "nodemailer"]
  node_bundler = "esbuild"

# A synchronous invocation always stops at 60 seconds and there is no setting
# to raise it, which is why generation runs as a background function.

# Local development: `netlify dev` from the project root serves the Vite app,
# runs both functions and starts the managed-Postgres-compatible local database,
# so the browser sees one origin and /api/* like it does when hosted.
[dev]
  command = "npm run dev --prefix client"
  targetPort = 5173

# These reach the static files only. The API answers with the same four headers
# from code (server/src/headers.js), because Netlify does not apply [[headers]]
# to function responses.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
