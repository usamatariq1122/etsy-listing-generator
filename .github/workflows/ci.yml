name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path:
            - server/package-lock.json
            - client/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Create the git-ignored copies the app imports
        # masterPrompt.js, rules.js and prompts/wording.js are generated from the
        # example files and never committed, so a checkout has to build them
        # before anything can import them.
        run: npm run setup --prefix server

      - name: Run server tests
        run: npm test --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build client
        run: npm run build --prefix client
